version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l

  run:
    desc: Run Go proxy server
    cmds:
      - cmd: bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp'
        platforms: [linux, darwin]
      - cmd: cmd /c go run .\cmd\yallmp
        platforms: [windows]

  run:reload:
    desc: Run Go proxy server (reload not yet implemented)
    cmds:
      - cmd: bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp'
        platforms: [linux, darwin]
      - cmd: cmd /c go run .\cmd\yallmp
        platforms: [windows]

  forwarder:
    desc: Run Go TCP forwarder
    cmds:
      - cmd: cmd /c go run .\cmd\yallmp-tcp-forwarder
        platforms: [windows]
      - cmd: bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-tcp-forwarder'
        platforms: [linux, darwin]

  forwarder:http:
    desc: Run Go HTTP forwarder (reverse proxy)
    cmds:
      - cmd: bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-forwarder'
        platforms: [linux, darwin]
      - cmd: cmd /c go run .\cmd\yallmp-forwarder
        platforms: [windows]

  ssl:generate-certs:
    desc: Generate SSL certificates using mkcert
    cmds:
      - cmd: cmd /c "if not exist certs mkdir certs && mkcert -cert-file certs\\cert.pem -key-file certs\\key.pem localhost 127.0.0.1"
        platforms: [windows]
      - cmd: bash -c 'HOSTS="${SSL_HOSTS:-localhost 127.0.0.1}"; CERT="${SSL_CERT:-certs/cert.pem}"; KEY="${SSL_KEY:-certs/key.pem}"; mkdir -p "$(dirname "$CERT")" "$(dirname "$KEY")"; mkcert -cert-file "$CERT" -key-file "$KEY" $HOSTS'
        platforms: [linux, darwin]

  install:
    desc: Download Go module dependencies
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" mod download'

  install:dev:
    desc: Download Go module dependencies
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" mod download'

  test:
    desc: Run Go tests
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" test ./...'

  vet:
    desc: Run Go static analysis
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" vet ./...'

  test:race:
    desc: Run Go tests with the race detector
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" test -race ./...'

  test:postgres:
    desc: Run gated PostgreSQL logdb integration tests when YALLMP_TEST_POSTGRES_DSN is set
    cmds:
      - bash -c 'if [ -z "$YALLMP_TEST_POSTGRES_DSN" ]; then echo "YALLMP_TEST_POSTGRES_DSN not set; skipping PostgreSQL logdb integration tests"; exit 0; fi; GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" test ./internal/logdb -run TestPostgresIntegrationLogDB -count=1'

  smoke:fake:
    desc: Run fake upstream/client smoke test against Go proxy
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-smoke --mode=fake {{.CLI_ARGS}}'

  smoke:real:
    desc: Run real local-model smoke test with external config (defaults to glm_local)
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-smoke --mode=real {{.CLI_ARGS}}'

  frontend:install:
    desc: Install admin frontend dependencies
    dir: web/admin
    cmds:
      - npm install

  frontend:dev:
    desc: Run Vite admin frontend dev server
    dir: web/admin
    cmds:
      - npm run dev -- {{.CLI_ARGS}}

  frontend:build:
    desc: Build admin frontend into web/admin/dist
    dir: web/admin
    cmds:
      - npm run build

  frontend:ci:
    desc: Install locked frontend dependencies, build, and verify the committed bundle is current
    dir: web/admin
    cmds:
      - npm ci
      - npm run build
      - git diff --exit-code -- dist

  audit:
    desc: Run the local release-readiness audit
    cmds:
      - task: frontend:ci
      - task: vet
      - task: test
      - task: test:race
      - task: smoke:fake

  audit:vuln:
    desc: Scan called Go code for known vulnerabilities (requires network access)
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...'

  clean:
    desc: Clear all logs (deletes all files in logs directory except database)
    cmds:
      - cmd: cmd /c if exist "{{.TASKFILE_DIR}}\logs\yaLLM.db" move "{{.TASKFILE_DIR}}\logs\yaLLM.db" "{{.TASKFILE_DIR}}\logs\yaLLM.db.bak"
        platforms: [windows]
      - cmd: cmd /c if exist "{{.TASKFILE_DIR}}\logs" rmdir /s /q "{{.TASKFILE_DIR}}\logs"
        platforms: [windows]
      - cmd: cmd /c if not exist "{{.TASKFILE_DIR}}\logs" mkdir "{{.TASKFILE_DIR}}\logs"
        platforms: [windows]
      - cmd: cmd /c if exist "{{.TASKFILE_DIR}}\logs\yaLLM.db.bak" move "{{.TASKFILE_DIR}}\logs\yaLLM.db.bak" "{{.TASKFILE_DIR}}\logs\yaLLM.db"
        platforms: [windows]
      - cmd: bash -c 'if [ -f "{{.TASKFILE_DIR}}/logs/yaLLM.db" ]; then mv "{{.TASKFILE_DIR}}/logs/yaLLM.db" "{{.TASKFILE_DIR}}/logs/yaLLM.db.bak"; fi && rm -rf "{{.TASKFILE_DIR}}/logs" && mkdir -p "{{.TASKFILE_DIR}}/logs" && if [ -f "{{.TASKFILE_DIR}}/logs/yaLLM.db.bak" ]; then mv "{{.TASKFILE_DIR}}/logs/yaLLM.db.bak" "{{.TASKFILE_DIR}}/logs/yaLLM.db"; fi'
        platforms: [linux, darwin]

  db-clean:
    desc: Clean request/error logs from database
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-db-clean {{.CLI_ARGS}}'

  db-clean-dry-run:
    desc: Preview what would be cleaned (dry run)
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-db-clean --dry-run {{.CLI_ARGS}}'

  db-clean-old:
    desc: Clean logs older than N days
    cmds:
      - bash -c 'GO_BIN="${GO:-$(command -v go || printf .tools/go/bin/go)}"; "$GO_BIN" run ./cmd/yallmp-db-clean --all --keep-days={{.KEEPS_DAYS | default "7"}} {{.CLI_ARGS}}'
